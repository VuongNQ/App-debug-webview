name: Flutter Release Build

on:
  push:
    tags:
      - '*flutter-release*'
  workflow_dispatch:

jobs:
  build-flutter-release:
    name: Build Flutter release artifacts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/webview-debug-flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk-${{ github.ref_name }}
          path: apps/webview-debug-flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-aab-${{ github.ref_name }}
          path: apps/webview-debug-flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
